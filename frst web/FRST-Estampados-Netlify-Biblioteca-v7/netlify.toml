[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.frst-app]
  included_files = [".netlify/functions-internal/**"]

[[redirects]]
  from = "/api/state"
  to = "/.netlify/functions/frst-state"
  status = 200
  force = true

[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/frst-login"
  status = 200
  force = true

[[redirects]]
  from = "/api/files"
  to = "/.netlify/functions/frst-files"
  status = 200
  force = true

[[redirects]]
  from = "/api/approval/*"
  to = "/.netlify/functions/frst-approval?token=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/frst-app"
  status = 200
  force = false
